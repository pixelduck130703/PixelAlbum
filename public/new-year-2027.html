<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy New Year 2027</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1d1940;color:#aaa5fb;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.page{min-height:100svh;display:grid;place-items:center;isolation:isolate;background:radial-gradient(ellipse at 50% 55%,#292053 0%,#1d1940 65%)}.scene{position:relative;width:min(92vw,850px);height:440px;max-height:80svh}.year{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);display:flex;font-weight:800;font-size:clamp(64px,15vw,132px);letter-spacing:-.045em;line-height:1}.prefix{display:block}.slot{position:relative;width:.63em;height:1em}.old,.new{position:absolute;left:0;top:0}.old{animation:oldAway 10s both}.new{animation:newIn 10s both}.balloon{position:absolute;width:43px;height:54px;left:50%;bottom:calc(100% + 62px);transform:translateX(-50%);background:#efdd7c;border-radius:50% 50% 46% 46%;box-shadow:inset -6px -4px 0 #d5bc5c33;animation:balloonTrip 10s both;z-index:2}.balloon:before{content:"";position:absolute;top:100%;left:50%;height:62px;width:1px;background:#e8dba1;transform:translateX(-50%)}.balloon:after{content:"";position:absolute;bottom:-4px;left:calc(50% - 4px);border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid #efdd7c}.greeting{position:absolute;top:21%;left:0;right:0;text-align:center;color:#f18bc2;font-family:"Brush Script MT","Segoe Script",cursive;font-style:italic;font-weight:bold;font-size:clamp(30px,6.7vw,64px);opacity:0;animation:greetingIn 10s both;text-shadow:0 0 25px #f18bc233}.wish{position:absolute;top:73%;width:100%;text-align:center;color:#c2badb;font-size:clamp(12px,2.4vw,16px);letter-spacing:.13em;opacity:0;animation:wishIn 10s both}.spark{position:absolute;left:var(--x);top:var(--y);width:72px;height:72px;opacity:0;animation:burst 2s var(--delay) infinite}.ray{position:absolute;left:50%;top:50%;width:2px;height:26px;background:linear-gradient(transparent,var(--color));transform:rotate(var(--angle)) translateY(-35px);transform-origin:50% 0}.controls{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button{border:1px solid #a9a0db50;border-radius:99px;background:#ffffff09;color:#d9d1f0;padding:12px 22px;font:inherit;font-size:13px;cursor:pointer}.controls button:hover{background:#ffffff18}.controls button:focus-visible{outline:2px solid #efdd7c;outline-offset:4px}.tag{position:fixed;top:28px;width:100%;text-align:center;color:#b8aed4;font-size:12px;letter-spacing:.24em}.scene.paused *{animation-play-state:paused!important}
@keyframes oldAway{0%,33%{transform:translate(0,0);opacity:1}44%{transform:translate(0,-10px);opacity:1}65%,100%{transform:translate(15px,-390px);opacity:0}}
@keyframes newIn{0%,15%{transform:translateX(clamp(100px,22vw,195px));opacity:1}34%{transform:translateX(.62em);opacity:1}49%,100%{transform:translateX(0);opacity:1}}
@keyframes balloonTrip{0%,15%{transform:translateX(calc(-50% + clamp(100px,22vw,195px)))}34%,38%{transform:translateX(-50%)}44%{transform:translate(-50%,-10px);opacity:1}65%,100%{transform:translate(calc(-50% + 15px),-390px);opacity:0}}
@keyframes greetingIn{0%,52%{opacity:0;transform:translateY(14px) scale(.92)}65%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes wishIn{0%,65%{opacity:0;transform:translateY(10px)}78%,100%{opacity:1;transform:translateY(0)}}
@keyframes burst{0%{opacity:0;transform:scale(.15) rotate(0)}20%{opacity:.9}75%{opacity:.5}100%{opacity:0;transform:scale(1.15) rotate(18deg)}}
@media(max-width:480px){.spark{width:40px;height:40px}.ray{height:17px;transform:rotate(var(--angle)) translateY(-23px)}.scene{height:350px}.greeting{top:25%}.wish{top:68%;letter-spacing:.04em}}@media(prefers-reduced-motion:reduce){.old,.balloon{display:none}.new{animation:none;transform:none}.greeting,.wish{animation:none;opacity:1}.spark{animation:none;opacity:.5}.controls{display:none}}
</style>
</head>
<body>
<main class="page">
<div class="tag">A NEW CHAPTER BEGINS</div>
<div class="scene" id="scene" role="img" aria-label="Bóng bay kéo số 6 lên, năm 2026 chuyển thành 2027. Happy New Year!">
<div class="greeting">Happy new year</div>
<div class="year" aria-hidden="true"><span class="prefix">202</span><span class="slot"><span class="old">6</span><span class="new">7</span><span class="balloon"></span></span></div>
<div class="wish">Chúc mừng năm mới · Bình an &amp; thịnh vượng</div>
</div>
<div class="controls"><button type="button" id="replay">↻ Phát lại</button><button type="button" id="pause" aria-pressed="false">Tạm dừng</button></div>
</main>
<script>
const scene=document.getElementById('scene');
const positions=[[8,30],[80,25],[3,62],[87,62],[26,12],[64,9]];
positions.forEach(([x,y],index)=>{const spark=document.createElement('span');spark.className='spark';spark.setAttribute('aria-hidden','true');spark.style.cssText=`--x:${x}%;--y:${y}%;--delay:${6.2+index*.23}s;--color:${index%2?'#f18bc2':'#efdd7c'}`;for(let i=0;i<8;i++){const ray=document.createElement('i');ray.className='ray';ray.style.setProperty('--angle',`${i*45}deg`);spark.appendChild(ray)}scene.appendChild(spark)});
const pause=document.getElementById('pause');
pause.onclick=()=>{const paused=scene.classList.toggle('paused');pause.textContent=paused?'Tiếp tục':'Tạm dừng';pause.setAttribute('aria-pressed',String(paused))};
document.getElementById('replay').onclick=()=>{scene.classList.remove('paused');pause.textContent='Tạm dừng';pause.setAttribute('aria-pressed','false');scene.getAnimations({subtree:true}).forEach(animation=>{animation.currentTime=0;animation.play()})};
</script>
</body>
</html>
