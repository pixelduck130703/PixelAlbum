<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giao thừa 2027</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #fff0d3;
      background: #130d28;
      font-family: "DM Sans", Arial, sans-serif;
    }

    main {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 78% 85%, #67244988, transparent 49%),
        radial-gradient(ellipse at 15% 20%, #4c296d88, transparent 55%),
        linear-gradient(155deg, #141028, #26102e 62%, #3c182e);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .frame {
      position: absolute;
      inset: 16px;
      border: 1px solid #ffc67e44;
      pointer-events: none;
    }

    .frame::before,
    .frame::after {
      content: "✦";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 8px;
      background: #341831;
      color: #f5c689;
      font-size: 15px;
    }

    .frame::before { top: -10px; }
    .frame::after { bottom: -9px; }

    .tag,
    footer {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
    }

    .tag {
      top: 8%;
      color: #ffe1b7;
      font-size: 10px;
      letter-spacing: .33em;
    }

    section {
      position: relative;
      padding: 50px 10px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #ffccdd;
      font: italic clamp(30px, 6vw, 76px)/1.1 Georgia, serif;
      text-shadow: 0 2px 24px #ed53897a;
    }

    .year {
      display: inline-flex;
      padding-right: .065em;
      font: normal clamp(86px, 22vw, 260px)/1 Georgia, serif;
      letter-spacing: -.065em;
    }

    .gold {
      color: #ffe4a2;
      background: linear-gradient(
        165deg,
        #fffcee 8%, #ffdfa2 30%, #cb813c 53%, #fff1b5 68%, #edac60 88%
      );
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 1px #783a32);
    }

    .slot {
      position: relative;
      width: .53em;
    }

    .old,
    .new {
      position: absolute;
      inset: 0;
    }

    .old { animation: lift 3.8s both; }
    .new { animation: arrive 3.8s both; }

    .balloon {
      position: absolute;
      bottom: 99%;
      left: 52%;
      width: .24em;
      height: .3em;
      border-radius: 52% 48% 46% 49%;
      background: radial-gradient(
        ellipse at 32% 25%, #fff6cc, #ffc763 27%, #e48b3e 60%, #9e492e
      );
      box-shadow: 0 0 25px #ffac5c44;
      transform: translateY(-.2em);
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 42%;
      height: .21em;
      border-left: 1px solid #ffe4a6;
    }

    .divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #ffc57e;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 54px;
      height: 1px;
      background: #dfaa6780;
    }

    .wish {
      margin: 12px 0;
      color: #fff0dd;
      font: clamp(15px, 2.2vw, 23px) Georgia, serif;
    }

    footer {
      bottom: 8%;
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    button {
      padding: 11px 19px;
      color: #ffe6cf;
      background: #31182f;
      border: 1px solid #eab89066;
      border-radius: 40px;
      font: 14px Arial, sans-serif;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible { background: #683451; }

    main.paused * { animation-play-state: paused !important; }

    @keyframes lift {
      0%, 34% { transform: none; opacity: 1; }
      100% { transform: translate(20px, -65vh) rotate(9deg); opacity: 0; }
    }

    @keyframes arrive {
      0%, 43% { transform: translateY(.3em); opacity: 0; }
      100% { transform: none; opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .old, footer { display: none; }
      .new { animation: none; }
    }
  </style>
</head>

<body>
  <main id="card">
    <canvas aria-hidden="true"></canvas>
    <div class="frame" aria-hidden="true"></div>
    <div class="tag" lang="en">A NEW CHAPTER BEGINS</div>

    <section aria-label="Chúc mừng năm mới 2027">
      <h1 lang="en">Happy New Year</h1>

      <div class="year" aria-hidden="true">
        <span class="gold">202</span>
        <span class="slot">
          <span class="old">
            <i class="balloon"></i>
            <span class="gold">6</span>
          </span>
          <span class="new gold">7</span>
        </span>
      </div>

      <div class="divider" aria-hidden="true">✦</div>
      <p class="wish">Chúc mừng năm mới · Bình an &amp; thịnh vượng</p>
    </section>

    <footer>
      <button type="button" id="replay">↻ Phát lại</button>
      <button type="button" id="pause" aria-pressed="false">Tạm dừng</button>
    </footer>
  </main>

  <script>
    const card = document.querySelector("#card");
    const canvas = card.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const pauseButton = document.querySelector("#pause");
    const replayButton = document.querySelector("#replay");
    const motion = matchMedia("(prefers-reduced-motion: reduce)");

    const stars = Array.from({ length: 150 }, () => [
      Math.random(), Math.random(), Math.random()
    ]);

    // Mỗi chùm pháo gồm vị trí ngang, vị trí dọc, bán kính và tông màu.
    const blooms = [
      [.15, .28, .15, 42],
      [.82, .25, .16, 322],
      [.87, .68, .11, 186],
      [.12, .74, .12, 22],
      [.58, .13, .065, 278]
    ];

    let width, height, frame;
    let time = 0;
    let last = 0;
    let paused = false;

    function draw() {
      ctx.clearRect(0, 0, width, height);

      for (const [x, y, size] of stars) {
        ctx.fillStyle = `rgba(255, 229, 186, ${.28 + size * .65})`;
        ctx.fillRect(x * width, y * height, 1 + size, 1 + size);
      }

      blooms.forEach(([x, y, size, hue], index) => {
        const phase = (time * .28 + index * .37 + .42) % 1;
        const radius = Math.min(width, height) * size;
        ctx.lineWidth = 1.35;

        for (let i = 0; i < 96; i++) {
          const angle = i * 2.39996 + index;
          const reach = radius * (.48 + .52 * Math.abs(Math.sin(i * 95.3)));

          function point(t) {
            const distance = reach * Math.pow(t, .54);
            return [
              x * width + Math.cos(angle) * distance,
              y * height + Math.sin(angle) * distance + radius * t * t * .32
            ];
          }

          const [tailX, tailY] = point(Math.max(0, phase - .14));
          const [tipX, tipY] = point(phase);
          const glow = ctx.createLinearGradient(tailX, tailY, tipX + .001, tipY);

          glow.addColorStop(0, "transparent");
          glow.addColorStop(1, `hsla(${hue + i % 19}, 100%, 72%, ${1 - phase})`);

          ctx.strokeStyle = glow;
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(tipX, tipY);
          ctx.stroke();

          ctx.fillStyle = `rgba(255, 241, 205, ${1 - phase})`;
          ctx.fillRect(tipX, tipY, 1.6, 1.6);
        }
      });
    }

    function resize() {
      width = card.clientWidth;
      height = card.clientHeight;

      const scale = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * scale;
      canvas.height = height * scale;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      draw();
    }

    function tick(now) {
      if (last) time += Math.min(now - last, 80) / 1000;
      last = now;
      draw();
      frame = requestAnimationFrame(tick);
    }

    function sync() {
      cancelAnimationFrame(frame);
      last = 0;

      card.classList.toggle("paused", paused);
      pauseButton.textContent = paused ? "Tiếp tục" : "Tạm dừng";
      pauseButton.setAttribute("aria-pressed", String(paused));

      if (!paused && !motion.matches) {
        frame = requestAnimationFrame(tick);
      } else {
        draw();
      }
    }

    pauseButton.onclick = () => {
      paused = !paused;
      sync();
    };

    replayButton.onclick = () => {
      time = 0;
      paused = false;
      for (const animation of card.getAnimations({ subtree: true })) {
        animation.currentTime = 0;
      }
      sync();
    };

    motion.addEventListener("change", sync);
    window.addEventListener("resize", resize);
    resize();
    sync();
  </script>
</body>
</html>
